# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Review plans, region and names before applying. This file creates paid resources.
previews:
  generation: "off"

databases:
  - name: gagandeep-portfolio-db
    region: singapore
    postgresMajorVersion: "17"
    plan: 0.1c-256mb
    diskSizeGB: 5
    ipAllowList: []

services:
  - type: web
    name: gagandeep-portfolio-api
    runtime: python
    rootDir: apps/api
    region: singapore
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: uv sync --frozen --no-dev
    preDeployCommand: uv run --frozen --no-dev alembic upgrade head
    startCommand: uv run --frozen --no-dev python -m app.cli seed && uv run --frozen --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2 --no-proxy-headers
    healthCheckPath: /api/v1/health/ready
    disk:
      name: private-media
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.16"
      - key: UV_VERSION
        value: "0.13.6"
      - key: APP_ENV
        value: production
      - key: PUBLIC_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: gagandeep-portfolio-db
          property: connectionString
      - key: MEDIA_BACKEND
        value: local
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: CSRF_SECRET
        generateValue: true
      - key: ABUSE_HMAC_SECRET
        generateValue: true
      - key: TRUSTED_PROXY_CIDRS
        value: ""
      - key: LOG_LEVEL
        value: INFO
