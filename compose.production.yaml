name: gagandeep-portfolio-production
x-api: &api
  image: gagandeep-portfolio-api:local
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  env_file: .env
  environment:
    APP_ENV: ${APP_ENV:-development}
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Run make configure}
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    MEDIA_ROOT: /data/media
  volumes:
    - private_media:/data/media
  restart: unless-stopped
services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run make configure}
      POSTGRES_USER: ${POSTGRES_USER:?Run make configure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make configure}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  migrate:
    <<: *api
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli seed"]
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *api
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 10
  web:
    image: gagandeep-portfolio-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000/api/v1
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Run make configure}
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  proxy:
    image: nginx:1.30.0-alpine
    ports:
      - "127.0.0.1:${PORTFOLIO_HTTP_PORT:-3000}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  private_media:
