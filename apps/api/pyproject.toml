[project]
name = "portfolio-api"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.162.4", "uvicorn[standard]==0.54.0", "sqlalchemy==2.1.8", "psycopg[binary]==3.3.8", "alembic==1.20.1", "pydantic-settings==2.16.2", "email-validator==2.3.0", "argon2-cffi==25.1.0", "pillow==13.0.0", "pypdf==7.0.1", "python-multipart==0.0.33", "typer==0.29.1", "httpx==0.28.1"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
    "mypy==2.4.1",
    "httpx2==2.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
